# Windows on ARM: package the ARM64 release the way release.yml does (cross-compiled on an x64
# runner, unsigned here), then install that per-user MSI on a Windows 11 ARM64 runner: once with
# the defaults (default folder, Start Menu and desktop shortcuts) and once into a chosen folder
# without the desktop shortcut, checking the binary is ARM64 and that each uninstall removes
# everything. The launcher is a GUI app, so it isn't run here. Self-contained (security-review-1
# M9): no other organisation's workflow or action; GitHub's own actions pinned to their tags'
# commits.
name: Windows ARM64

# Nightly on main (dependency and runner-image drift shows up within a day), and on PRs that
# change the Windows packaging itself.
on:
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WIX_VERSION: "5.0.2"

jobs:
  package:
    name: package (cross-compiled on x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-pc-windows-msvc
          rustup default stable
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed' }
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          DIST: ${{ github.workspace }}\dist\arm64
        run: ./packaging/windows/package.ps1 -Arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keep-launcher-windows-arm64
          path: dist/arm64/*
          if-no-files-found: error
          retention-days: 7

  install:
    name: install on ARM64
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keep-launcher-windows-arm64
          path: dist
      - name: Install the MSI, check it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # keep-launcher.wxs: per-user, by default into %LOCALAPPDATA%\Programs\MoneyKeep\Launcher.
          $defaultDir = Join-Path $env:LOCALAPPDATA 'Programs\MoneyKeep\Launcher'
          $startLnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'MoneyKeep Launcher.lnk'
          $deskLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MoneyKeep Launcher.lnk'
          $key = 'HKCU:\Software\MoneyKeep Project\MoneyKeep Launcher'
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          function Install([string[]] $props) {
            $p = Start-Process msiexec.exe -ArgumentList (@('/i', "`"$msi`"", '/qn', '/l*v', 'install.log') + $props) -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "msiexec /i exited $($p.ExitCode)" }
          }
          function Expect([bool] $ok, [string] $what) { if (-not $ok) { Get-Content install.log -Tail 60; throw $what }; Write-Output "ok $what" }
          function Uninstall([string] $exe) {
            $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
            foreach ($left in $exe, $startLnk, $deskLnk) { if (Test-Path -LiteralPath $left) { throw "uninstall left $left behind" } }
            if ((Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue).InstallDir) { throw "uninstall left InstallDir in $key" }
            Write-Output 'ok uninstalled'
          }

          Install @()
          $exe = Join-Path $defaultDir 'keep-launcher.exe'
          Expect (Test-Path -LiteralPath $exe) "installed in the default folder: $exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          Expect ($machine -eq 0xAA64) "the exe is ARM64 (machine 0x$('{0:X}' -f $machine))"
          Expect (Test-Path -LiteralPath (Join-Path $defaultDir 'THIRD-PARTY-LICENSES.txt')) 'THIRD-PARTY-LICENSES.txt installed'
          Expect (Test-Path -LiteralPath $startLnk) "Start Menu shortcut: $startLnk"
          Expect (Test-Path -LiteralPath $deskLnk) "desktop shortcut: $deskLnk"
          Uninstall $exe

          $dir = Join-Path $env:LOCALAPPDATA 'MoneyKeep Launcher Test Folder'
          Install @("INSTALLFOLDER=`"$dir\`"", 'INSTALLDESKTOPSHORTCUT=0')
          $exe = Join-Path $dir 'keep-launcher.exe'
          Expect (Test-Path -LiteralPath $exe) "installed in the chosen folder: $exe"
          Expect (Test-Path -LiteralPath $startLnk) "Start Menu shortcut: $startLnk"
          Expect (-not (Test-Path -LiteralPath $deskLnk)) 'no desktop shortcut when not wanted'
          Uninstall $exe
          Expect (-not (Test-Path -LiteralPath $dir)) 'uninstall removed the chosen folder'
