# Builds every platform's release and creates the draft GitHub Release "MoneyKeep Launcher
# v<version>" with SHA256SUMS.txt. Runs on a pushed version tag (v<version>, matching Cargo.toml)
# and by hand (workflow_dispatch), never on a pull request: the macOS job runs on the project's
# own Mac (a self-hosted runner; MoneyKeep's docs/specs/macos-release.md, owner runbook
# docs/deploy/mac-runner.md in the MoneyKeep repository), and `cargo xtask workflows` fails if any
# other workflow names a self-hosted runner or this one gains another trigger.
# Self-contained (security-review-1 M9, owner decision D2): every job is defined here and calls no
# other organisation's workflow or action. The Windows signing secrets come from the repository's
# `release` environment, and the macOS job waits for the owner's approval in the `mac-release`
# environment; secrets are read only by the steps below that sign. Actions are GitHub's own (actions/*) or, for the FreeBSD VM, vmactions/freebsd-vm; each is
# pinned to the full commit of the tag named beside it, as listed in that action's own repository.
# Tools are downloaded from their publishers' releases and checked against a SHA-256 written here.
#
# Assets (AGENTS.md section 4; the launcher's self-update and the README rely on the names):
#   Windows  keep-launcher-<ver>-windows-{x64,x86,arm64}.msi and …-portable.zip
#   macOS    keep-launcher-<ver>-macos-universal.dmg
#   Linux    keep-launcher-<ver>-linux-{x86_64,aarch64}.{AppImage,AppImage.zsync,deb,rpm,tar.gz,flatpak}
#            keep-launcher-<ver>-linux-riscv64.{deb,rpm,tar.gz}
#   FreeBSD  keep-launcher-<ver>-freebsd-x86_64.tar.gz
#   Web      keep-launcher-web-<ver>.zip
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""
      macos:
        description: "macOS build: runner (the project's Mac), github (GitHub's macos-15, signing from secrets, for when the Mac is away) or skip (no macOS asset; the release text says so). A tag push always uses runner."
        type: choice
        options: [runner, github, skip]
        default: runner

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  NFPM_VERSION: "2.47.0"
  WIX_VERSION: "5.0.2"
  TRUNK_VERSION: "0.21.14"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      macos: ${{ steps.v.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MACOS: ${{ inputs.macos }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if [[ ! "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # A tag push is a release: the tag must be the workspace version, and it always builds
          # on the project's Mac (the input exists only for workflow_dispatch).
          macos="${INPUT_MACOS:-runner}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            macos=runner
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $v (Cargo.toml): tag v$v instead"
              exit 1
            fi
          fi
          case "$macos" in
            runner | github | skip) ;;
            *) echo "::error::macos must be runner, github or skip, not '$macos'"; exit 1 ;;
          esac
          # Stop before the long builds (and the Mac approval) when the release is already out.
          if [ "$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo "::error::Release v$v is already published. Bump the version (cargo xtask version set) and tag again."
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$v"; echo "date=$(date -u +%Y-%m-%d)"; echo "prerelease=$pre"; echo "macos=$macos"; } >>"$GITHUB_OUTPUT"
          echo "### MoneyKeep Launcher v$v (\`${GITHUB_SHA::9}\`), macOS: $macos" >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      KEEP_LAUNCHER_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable
      - name: Apply the version override
        if: inputs.version != ''
        shell: bash
        run: cargo xtask version set "$KEEP_LAUNCHER_VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed' }
      # Signing is optional, as in MoneyKeep's release.yml: a PFX pair, or all six Azure Trusted
      # Signing values. Without them a tagged release is built unsigned and this step says so in a
      # warning (sign.ps1 warns too). Only this step and the next read the signing secrets.
      - name: Check the signing secrets for a tagged release
        if: github.event_name == 'push'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then exit 0; fi
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::This Windows release is not signed. To sign it, set WINDOWS_CERTIFICATE (and its password) or these Azure Trusted Signing secrets in the release environment:$missing"
          fi
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # macOS (MoneyKeep's docs/specs/macos-release.md, W1-W5). By default the job runs on the
  # project's own Mac, a self-hosted runner the owner keeps (runbook: docs/deploy/mac-runner.md in
  # the MoneyKeep repository), and it waits for the owner's approval in the `mac-release`
  # environment (O3). workflow_dispatch can send it to GitHub's macos-15 instead (`macos: github`,
  # signing from the APPLE_* secrets as before) or leave it out (`macos: skip`); a tag push always
  # uses the Mac. A queued job waits for the Mac (GitHub cancels it after 24 hours) and the draft
  # release waits for it: if the Mac is away, cancel and run the workflow by hand with
  # `macos: github` or `skip`.
  macos:
    name: macOS universal (${{ needs.version.outputs.macos }})
    needs: version
    if: needs.version.outputs.macos != 'skip'
    runs-on: ${{ fromJSON(needs.version.outputs.macos == 'github' && '"macos-15"' || '["self-hosted","macOS","ARM64","mk-mac"]') }}
    timeout-minutes: 120
    environment: mac-release
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      MACOS_MODE: ${{ needs.version.outputs.macos }}
    steps:
      # Scripts run with `bash`: they are not stored as executable in git.
      # The runner's workspace survives between runs: check out clean and remove anything untracked
      # (W3). The build cache lives outside the workspace (next step).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Remove untracked files
        run: git clean -ffdx
      - name: Install Rust (GitHub's Mac)
        if: env.MACOS_MODE == 'github'
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      # On the project's Mac rustup and the toolchain are installed once by the owner (runbook step
      # 4) and updated monthly; this only adds missing targets. Builds go to a kept folder outside
      # the workspace, emptied when the compiler changes, so a release rebuilds only what changed.
      - name: Rust and the build folder (the project's Mac)
        if: env.MACOS_MODE == 'runner'
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            # shellcheck disable=SC1091
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          want="$(rustc --version)"
          dir="$HOME/mk-build/keep-launcher"
          if [ -d "$dir" ] && [ "$(cat "$dir/rustc-version.txt" 2>/dev/null || true)" != "$want" ]; then
            echo "The compiler changed ($want): emptying $dir"
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          printf '%s\n' "$want" >"$dir/rustc-version.txt"
          echo "CARGO_TARGET_DIR=$dir" >>"$GITHUB_ENV"
          echo "$want; build folder $dir"
          df -h "$HOME" | tail -n 1
      - name: Apply the version override
        if: inputs.version != ''
        run: cargo xtask version set "$KEEP_LAUNCHER_VERSION"
      # GitHub's Mac: the certificate comes from the APPLE_* secrets (in the mac-release
      # environment). Without them, import-cert.sh warns and package.sh signs ad hoc.
      - name: Import the signing certificate (GitHub's Mac)
        if: env.MACOS_MODE == 'github'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash packaging/macos/import-cert.sh
      # The project's Mac: no secret leaves GitHub. The Developer ID key and the notarytool
      # profile live in the Mac's own mk-signing keychain (runbook step 8). Until the owner enrols
      # (O1) there is none, and package.sh signs ad hoc with a warning.
      - name: Find the signing keychain (the project's Mac)
        if: env.MACOS_MODE == 'runner'
        run: bash packaging/macos/runner-keychain.sh
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_TEAM_ID || '' }}
        run: bash packaging/macos/package.sh --arch universal
      - name: Verify the signature and notarization
        env:
          APPLE_ID: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_TEAM_ID || '' }}
        run: bash packaging/macos/verify.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      # GitHub's Mac only. On the project's Mac MACOS_KEYCHAIN is the kept mk-signing keychain,
      # which must never be deleted.
      - name: Remove the temporary keychain
        if: always() && env.MACOS_MODE == 'github'
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # Ubuntu 22.04 (glibc 2.35), so the binaries run on newer distributions.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64, nfpm-sha256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64, nfpm-sha256: 27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97 }
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and packaging tools
        env:
          DEB_ARCH: ${{ matrix.deb }}
          NFPM_SHA256: ${{ matrix.nfpm-sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            pkg-config desktop-file-utils appstream zsync
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${DEB_ARCH}.deb"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Apply the version override
        if: inputs.version != ''
        run: cargo xtask version set "$KEEP_LAUNCHER_VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DIST: ${{ github.workspace }}/dist/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: packaging/linux/flatpak-bundle.sh "dist/linux/keep-launcher-${KEEP_LAUNCHER_VERSION}-linux-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/flatpak/*.flatpak
          if-no-files-found: error

  linux-riscv64:
    name: Linux riscv64
    needs: version
    # Cross-compiled on Ubuntu 24.04, so its glibc floor is 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      GLIBC_FLOOR: "2.39"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the riscv64 cross toolchain and nfpm
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo dpkg --add-architecture riscv64
          # The runner's sources are amd64 only; riscv64 packages come from Ubuntu's ports mirror.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
            echo "deb [arch=riscv64] https://ports.ubuntu.com/ubuntu-ports $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/riscv64.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross libc6-dev:riscv64 qemu-user \
            libxkbcommon-dev:riscv64 libwayland-dev:riscv64 libx11-dev:riscv64 libxrandr-dev:riscv64 \
            libxi-dev:riscv64 libgl1-mesa-dev:riscv64 pkg-config desktop-file-utils appstream
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target riscv64gc-unknown-linux-gnu
          rustup default stable
      - name: Apply the version override
        if: inputs.version != ''
        run: cargo xtask version set "$KEEP_LAUNCHER_VERSION"
      - name: Build and package (deb, rpm, tar.gz)
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats "deb rpm tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    needs: version
    # GitHub has no FreeBSD runners: the build runs in a FreeBSD VM on a Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          envs: "KEEP_LAUNCHER_VERSION KEEP_LAUNCHER_BUILD_DATE KEEP_LAUNCHER_BUILD_SHA INPUT_VERSION"
          prepare: |
            pkg install -y bash git curl pkgconf libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            if [ -n "$INPUT_VERSION" ]; then cargo xtask version set "$KEEP_LAUNCHER_VERSION"; fi
            bash packaging/freebsd/package.sh
            ls dist/release/keep-launcher-*-freebsd-x86_64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*-freebsd-x86_64.tar.gz
          if-no-files-found: error

  web:
    name: Web (wasm)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KEEP_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      KEEP_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      KEEP_LAUNCHER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install trunk
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
      - name: Apply the version override
        if: inputs.version != ''
        run: cargo xtask version set "$KEEP_LAUNCHER_VERSION"
      - name: Build and zip
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [version, windows, macos, linux, flatpak, linux-riscv64, freebsd, web]
    # Every build must succeed, except that the macOS one may be left out on purpose (`macos: skip`).
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.windows.result == 'success'
      && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && needs.version.outputs.macos == 'skip'))
      && needs.linux.result == 'success'
      && needs.flatpak.result == 'success'
      && needs.linux-riscv64.result == 'success'
      && needs.freebsd.result == 'success'
      && needs.web.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Create or update the draft release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          MACOS: ${{ needs.version.outputs.macos }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="MoneyKeep Launcher v$VERSION"
          # `macos: skip` says so at the top of the release text; a later run with a Mac build
          # takes the line out again.
          skip_mark="No macOS build in this release"
          skip_note="**$skip_mark.** The Mac build was left out of this run; the next release will have one."
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            body="$(gh release view "$tag" --json body --jq .body)"
            body="$(printf '%s\n' "$body" | grep -vF "$skip_mark" || true)"
            if [ "$MACOS" = skip ]; then body="$skip_note"$'\n\n'"$body"; fi
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" --notes "$body"
            gh release upload "$tag" --clobber -- *
          else
            pre=()
            if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
            # With --notes, gh appends the generated notes after the given text.
            notes=()
            if [ "$MACOS" = skip ]; then notes=(--notes "$skip_note"); fi
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${notes[@]}" "${pre[@]}" -- *
          fi
          if [ "$MACOS" = skip ]; then echo "$skip_note" >>"$GITHUB_STEP_SUMMARY"; fi
          { echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"; echo; sed 's/^/    /' SHA256SUMS.txt; } >>"$GITHUB_STEP_SUMMARY"
