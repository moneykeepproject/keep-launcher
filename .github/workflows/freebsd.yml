# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). It then runs packaging/freebsd/package.sh, the script the
# release job runs, and checks the tarball, so a broken FreeBSD package fails here before it can
# fail a release. Nothing is uploaded and no secrets are used. Self-contained (security-review-1
# M9); the VM action is pinned to its v1.5.9 tag's commit.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every push
# or dependency change: a drifted dependency still shows up within a day, and always before a
# release ships. PRs that change the FreeBSD packaging itself still run it.
on:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package in a FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          copyback: false
          prepare: |
            pkg install -y bash git curl pkgconf libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            cargo build --workspace --locked
            cargo test --workspace --locked
            bash packaging/freebsd/package.sh
            tarball=$(ls dist/release/keep-launcher-*-freebsd-x86_64.tar.gz)
            tar -tzf "$tarball" | grep -E '/bin/keep-launcher$'
            tar -tzf "$tarball" | grep -E '/share/doc/keep-launcher/THIRD-PARTY-LICENSES.txt$'
