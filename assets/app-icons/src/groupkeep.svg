<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C7F63"/>
      <stop offset="1" stop-color="#245442"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B596"/>
      <stop offset="1" stop-color="#C98063"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8A788"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="24" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="23.5" fill="none" stroke="#173A2E" stroke-width="1"/>

  <!-- circle of arrows between the four people (clockwise) -->
  <g fill="none" stroke="#E8A788" stroke-width="4.2" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M47 21 A46 46 0 0 1 81 21"/>
    <path d="M111 51 A48 48 0 0 1 111 71"/>
    <path d="M80 113 A46 46 0 0 1 48 113"/>
    <path d="M17 71 A48 48 0 0 1 17 51"/>
  </g>

  <!-- four people (two men, two women): head + shoulders, copper with a dark outline -->
  <g fill="url(#cu)" stroke="#6E3B27" stroke-width="2.4" stroke-linejoin="round">
    <path d="M12 46 C12 35 18 31 27 31 C36 31 42 35 42 46 Z"/>
    <circle cx="27" cy="23.5" r="8.5"/>
    <path d="M90 34 C89 25 90 17 94 14 C97 11.5 105 11.5 108 14 C112 17 113 25 112 34 Z"/>
    <path d="M86 46 C86 35 92 31 101 31 C110 31 116 35 116 46 Z"/>
    <circle cx="101" cy="23" r="7.2"/>
    <path d="M16 104 C15 95 16 87 20 84 C23 81.5 31 81.5 34 84 C38 87 39 95 38 104 Z"/>
    <path d="M12 116 C12 105 18 101 27 101 C36 101 42 105 42 116 Z"/>
    <circle cx="27" cy="93" r="7.2"/>
    <path d="M86 116 C86 105 92 101 101 101 C110 101 116 105 116 116 Z"/>
    <circle cx="101" cy="93.5" r="8.5"/>
  </g>

  <!-- money at the centre of the circle: a stack of notes and a pile of coins -->
  <g stroke="#6E3B27" stroke-width="2.2" stroke-linejoin="round">
    <path d="M45 66 L79 60 L85 68 L51 74 Z" fill="#C98063"/>
    <path d="M45 60 L79 54 L85 62 L51 68 Z" fill="#D99273"/>
    <path d="M45 54 L79 48 L85 56 L51 62 Z" fill="url(#cu)"/>
    <ellipse cx="65" cy="55" rx="6" ry="3.2" fill="none" stroke-width="1.8"/>
    <path d="M58 81 v4 a7 3.4 0 0 0 14 0 v-4" fill="#C98063"/>
    <ellipse cx="65" cy="81" rx="7" ry="3.4" fill="#E8A788"/>
    <path d="M58 75 v4 a7 3.4 0 0 0 14 0 v-4" fill="#C98063"/>
    <ellipse cx="65" cy="75" rx="7" ry="3.4" fill="#E8A788"/>
  </g>
</svg>
